<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SafeOut</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#080810;--burg:#7D2545;--burg2:#9d3057;--text:rgba(255,255,255,.9);--text2:rgba(255,255,255,.45);--text3:rgba(255,255,255,.2);--border:rgba(255,255,255,.07)}
html,body{height:100%;background:var(--bg);font-family:'DM Sans',sans-serif;color:var(--text)}
body{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px;background:radial-gradient(ellipse 70% 50% at 50% 0%,rgba(125,37,69,.08),transparent 70%)}
.wrap{width:100%;max-width:680px}
.head{text-align:center;margin-bottom:48px}
.logo-img{width:120px;height:auto;margin:0 auto 4px;display:block}
.logo-name{font-family:'Syne',sans-serif;font-size:13px;font-weight:600;letter-spacing:.3em;color:var(--text3);text-transform:uppercase}
.grid{display:grid;grid-template-columns:1fr;gap:14px}
.card{display:flex;align-items:center;gap:18px;background:#0f0f1a;border:1px solid var(--border);border-radius:16px;padding:22px 24px;text-decoration:none;color:inherit;transition:border-color .2s,transform .2s;cursor:pointer}
.card:hover{border-color:var(--burg);transform:translateY(-2px)}
.card-icon{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:rgba(125,37,69,.12);border:1px solid rgba(125,37,69,.25)}
.card-icon svg{width:24px;height:24px;stroke:var(--burg2);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.card-body{flex:1}
.card-title{font-family:'Syne',sans-serif;font-size:16px;font-weight:700}
.card-arrow{font-size:22px;color:var(--text3)}
</style>
</head>
